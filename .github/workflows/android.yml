# Сборка приложения для Android (папка android/) и выкладка в релиз «app».
# Ссылка на файл всегда одна:
#   https://github.com/C0BecTb11/SW-RPG2.0/releases/download/app/sw-global-conflict.apk
# Подпись — постоянным ключом из секретов репозитория (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64  — файл ключа в base64
#   ANDROID_KEYSTORE_PASS — пароль
# Тот же ключ = новая версия ставится поверх старой без удаления.
name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Нет секретов ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS — без постоянного ключа обновления не встанут поверх старой версии"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/swgc.jks"
          echo "SWGC_KEYSTORE=$RUNNER_TEMP/swgc.jks" >> "$GITHUB_ENV"
          echo "SWGC_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"

      - name: Сборка
        working-directory: android
        # при ошибке — хвост вывода в аннотации запуска (их видно и без доступа к логам)
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console=plain assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            grep -E "error:|ERROR|FAILURE|What went wrong|e: |Could not" "$RUNNER_TEMP/gradle.log" | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            tail -25 "$RUNNER_TEMP/gradle.log" | while IFS= read -r l; do echo "::warning::$l"; done
            exit 1
          fi

      - name: Проверка подписи
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK не собран (нет подписи?)"; ls -R android/app/build/outputs/apk; exit 1; }
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -5
          cp "$APK" sw-global-conflict.apk

      - name: Релиз «app»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Star Wars: Global Conflict для Android. Версия 1.0.${GITHUB_RUN_NUMBER}. Обновления игры приходят сами; новый файл ставится поверх старого."
          if gh release view app >/dev/null 2>&1; then
            gh release upload app sw-global-conflict.apk --clobber
            gh release edit app --notes "$NOTE"
          else
            gh release create app sw-global-conflict.apk --title "Приложение для Android" --notes "$NOTE" --latest
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sw-global-conflict-apk
          path: sw-global-conflict.apk
