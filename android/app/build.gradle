// Обёртка игры для Android: одно окно WebView, внутри — сайт игры.
// Собирается на GitHub (.github/workflows/android.yml). Подпись — ключом из секретов
// ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS: один и тот же ключ, чтобы новые версии
// ставились поверх старых без удаления.
plugins { id 'com.android.application' }

def env = System.getenv()
def ksFile = env['SWGC_KEYSTORE'] ? file(env['SWGC_KEYSTORE']) : null
def run = (env['GITHUB_RUN_NUMBER'] ?: '1') as int

android {
    namespace 'io.github.c0bectb11.swgc'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.c0bectb11.swgc'
        minSdk 26
        targetSdk 34
        versionCode run
        versionName "1.0.${run}"
    }

    signingConfigs {
        release {
            if (ksFile != null && ksFile.exists()) {
                storeFile ksFile
                storePassword env['SWGC_KEYSTORE_PASS']
                keyAlias 'swgc'
                keyPassword env['SWGC_KEYSTORE_PASS']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = (ksFile != null && ksFile.exists()) ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
