<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Вход — Star Wars: Global Conflict</title>
<meta name="theme-color" content="#05060a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/app/icon-192.png">
<link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Global Conflict">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="css/auth.css?v=1">
<link rel="stylesheet" href="css/banner.css?v=1">
</head>
<body>

<div id="banner-placeholder"></div>

<div id="box">
  <div id="auth-box">
    <div class="tabs">
      <div class="tab active" id="tab-login">Вход</div>
      <div class="tab" id="tab-signup">Регистрация</div>
    </div>

    <label id="nickname-label" style="display:none;">Игровой ник</label>
    <input type="text" id="nickname" placeholder="как тебя видят другие игроки" style="display:none;">

    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

    <label>Пароль</label>
    <input type="password" id="password" placeholder="минимум 6 символов" autocomplete="current-password">

    <button id="submit-btn">Войти</button>
    <div id="message"></div>
  </div>

  <div id="session-box">
    <p>Ты вошёл как <span class="email" id="user-email"></span></p>
    <p class="session-nick" id="session-nick"></p>
    <a id="enter-btn" href="game/galaxy-map.html">В галактику</a>
    <button id="logout-btn">Выйти</button>
    <div id="session-note"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js?v=2"></script>
<script src="js/err-report.js?v=4"></script>
<script src="js/banner.js?v=1"></script>
<script src="js/auth.js?v=2"></script>
</body>
</html>
