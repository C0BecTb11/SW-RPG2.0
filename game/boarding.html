<!-- Экран перехода: стыковка, пока грузятся палубы (js/scene-loader.js) -->
<div id="scene-loader" aria-live="polite">
  <div class="sl-globe-wrap"><div class="sl-orbit"></div><div class="sl-globe bd-sl-ship"></div></div>
  <div class="sl-kicker">Стыковка</div>
  <div class="sl-name">…</div>
  <div class="sl-bar"><i></i></div>
  <div class="sl-step"></div>
</div>

<button id="bd-back">← Орбита</button>

<div id="bd-top" class="bd-top"></div>
<div id="bd-tabs"></div>

<div id="bd-view"></div>

<button id="bd-zoom" aria-label="Крупнее">+</button>
<div id="bd-hud"></div>
<div id="bd-toast"></div>
<div id="bd-end"></div>
