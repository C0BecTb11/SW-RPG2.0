<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Ивент — Star Wars: Global Conflict</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../assets/app/icon-192.png">
<link rel="apple-touch-icon" href="../assets/app/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Global Conflict">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="../space/space.css?v=24">
<link rel="stylesheet" href="../ground/ground.css?v=8">
<link rel="stylesheet" href="../css/event-live.css?v=4">
</head>
<body class="live event">
<canvas id="sp-canvas"></canvas>

<a id="sp-back" href="events.html">← Ивенты</a>
<div id="sp-tr">
  <div class="sp-speed" role="group" aria-label="Скорость боя" hidden>
    <button id="sp-pause" type="button" title="Пауза">❚❚</button>
    <button id="sp-spd" type="button" title="Скорость">×1</button>
  </div>
  <button id="sp-gfx-b" type="button" aria-label="Настройки графики" title="Настройки графики">
    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg>
  </button>
  <div id="sp-clock"><b id="sp-time">0:00</b><span class="fps"> · <span id="sp-fps">0</span> к/с</span></div>
</div>

<div class="sp-panel sp-top" id="sp-top">
  <div class="sp-row">
    <span class="sp-kicker" id="sp-kicker">Ивент</span>
    <span class="sp-spacer"></span>
    <span class="sp-side" id="sp-side">Республика</span>
  </div>
  <div class="sp-row gd-task">
    <i class="gd-globe ev-glyph" id="gd-globe"></i><b id="gd-planet">—</b>
    <span class="gd-goal" id="gd-goal"></span>
    <span class="sp-spacer"></span>
    <span class="ev-timer" id="ev-timer">—</span>
    <button class="sp-chip net" id="gd-poly-b" type="button" hidden>◎</button>
  </div>
  <div class="sp-row ev-line" id="ev-line"></div>
  <div class="sp-row gd-cap" id="gd-cap" hidden></div>
  <div class="sp-row gd-dist" id="gd-dist" hidden></div>
</div>

<div class="sp-panel sp-bottom" id="sp-bottom">
  <div class="sp-sheet" id="sp-sheet" hidden>
    <div class="sp-sheet-h"><span id="sp-sheet-t"></span><button class="sp-sheet-x" id="sp-sheet-x" type="button" aria-label="Свернуть">▾</button></div>
    <div class="sp-sheet-b" id="sp-sheet-b"><div id="sp-ship"></div></div>
  </div>
  <div id="sp-stat"></div>
  <div class="sp-dock" id="sp-dock">
    <span class="sp-tabs" id="sp-tabs"></span>
    <button class="sp-btn" id="gd-all" type="button">Все свои</button>
    <button class="sp-btn" id="sp-view" type="button">Вся карта</button>
  </div>
</div>

<div class="sp-end" id="sp-end" hidden>
  <div class="sp-end-card">
    <div class="sp-kicker">Итог боя</div>
    <h2 id="sp-end-title">Победа</h2>
    <p id="sp-end-text"></p>
    <div class="sp-btns" style="grid-template-columns:1fr 1fr">
      <button class="sp-btn" id="sp-end-look" type="button">Осмотреть</button>
      <button class="sp-btn gold" id="sp-end-again" type="button">Ещё бой</button>
    </div>
  </div>
</div>

<!-- полигон экрана наземки — в ивенте не открывается, но экран ждёт его разметку -->
<div class="sp-end sp-poly" id="sp-poly" hidden>
  <div class="sp-end-card">
    <div class="sp-poly-chips" id="gd-poly-planet"></div><div class="sp-poly-chips" id="gd-poly-side"></div><div class="sp-poly-chips" id="gd-poly-role"></div>
    <p id="gd-poly-role-h"></p><div class="sp-poly-chips" id="gd-poly-size"></div><p id="gd-poly-size-h"></p><div class="sp-poly-chips" id="gd-poly-foe"></div><p id="gd-poly-foe-h"></p>
    <div class="sp-poly-chips" id="gd-poly-lvl"></div><p id="gd-poly-lvl-h"></p><div class="sp-poly-chips" id="gd-poly-cap"></div><button id="gd-poly-go" type="button"></button>
  </div>
</div>

<!-- итог ивента: победа или поражение, причина, награда, трофей и титул -->
<div class="sp-end ev-end" id="ev-end" hidden>
  <div class="sp-end-card">
    <div class="sp-kicker" id="ev-end-k">Итог ивента</div>
    <div class="ev-end-mark" id="ev-end-mark"></div>
    <h2 id="ev-end-title">Победа</h2>
    <p id="ev-end-why"></p>
    <div class="ev-end-stats" id="ev-end-stats"></div>
    <div class="ev-end-award" id="ev-end-award"></div>
    <div class="sp-btns" style="grid-template-columns:1fr 1fr">
      <button class="sp-btn" id="ev-end-look" type="button">Осмотреть</button>
      <a class="sp-btn gold" id="ev-end-back" href="events.html">К ивентам</a>
    </div>
  </div>
</div>

<!-- брифинг: что делать, видно в начале боя -->
<div class="sp-end ev-brief" id="ev-brief" hidden>
  <div class="sp-end-card">
    <div class="sp-kicker" id="ev-brief-k">Брифинг</div>
    <h2 id="ev-brief-title"></h2>
    <p id="ev-brief-goal"></p>
    <ul class="ev-brief-list" id="ev-brief-list"></ul>
    <div class="ev-brief-who" id="ev-brief-who"></div>
    <div class="sp-btns" style="grid-template-columns:1fr"><button class="sp-btn gold" id="ev-brief-go" type="button">В бой</button></div>
  </div>
</div>

<div class="sp-toast" id="sp-toast"></div>
<div class="gp-load" id="gd-load"><div><span></span>Связь с боем…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="../js/supabase-client.js?v=2"></script>
<script src="../js/err-report.js?v=6"></script>
<script src="../shared/rt-core.js?v=5"></script>
<script src="../shared/rt-figures.js?v=7"></script>
<script src="../shared/rt-army.js?v=8"></script>
<script src="../shared/rt-planets.js?v=3"></script>
<script src="../shared/rt-units.js?v=4"></script>
<script src="../shared/rt-town.js?v=2"></script>
<script src="../shared/rt-ground.js?v=17"></script>
<script src="../shared/rt-ground-net.js?v=10"></script>
<script src="../shared/rt-vehicles.js?v=6"></script>
<script src="../shared/rt-heroes.js?v=2"></script>
<script src="../shared/rt-events-cat.js?v=2"></script>
<script src="../shared/rt-events.js?v=3"></script>
<script src="../ground/terrain.js?v=5"></script>
<script src="../space/space-gfx.js?v=1"></script>
<script src="../js/event-live.js?v=23"></script>
</body>
</html>
