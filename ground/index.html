<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Наземный бой 2.0</title>
<link rel="stylesheet" href="../space/space.css?v=16">
<link rel="stylesheet" href="ground.css?v=1">
</head>
<body>
<canvas id="sp-canvas"></canvas>

<a id="sp-back" href="../game/galaxy-map.html">← В игру</a>
<div id="sp-tr">
  <div class="sp-speed" role="group" aria-label="Скорость боя">
    <button id="sp-pause" type="button" title="Пауза">❚❚</button>
    <button id="sp-spd" type="button" title="Скорость: ×1, ×2, ×4">×1</button>
  </div>
  <button id="sp-gfx-b" type="button" aria-label="Настройки графики" title="Настройки графики">
    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg>
  </button>
  <div id="sp-clock"><b id="sp-time">0:00</b><span class="fps"> · <span id="sp-fps">0</span> к/с</span></div>
</div>

<div class="sp-panel sp-top" id="sp-top">
  <div class="sp-row">
    <span class="sp-kicker" id="sp-kicker">Наземный бой 2.0</span>
    <span class="sp-spacer"></span>
    <span class="sp-side" id="sp-side">Республика</span>
  </div>
  <div class="sp-row sp-scen" id="sp-scen">
    <button class="sp-chip net" data-poly="1">◎ Полигон</button>
    <span class="gd-planets" id="gd-planets"></span>
  </div>
  <div class="sp-row gd-cap" id="gd-cap"></div>
</div>

<div class="sp-panel sp-bottom" id="sp-bottom">
  <div class="sp-sheet" id="sp-sheet" hidden>
    <div class="sp-sheet-h"><span id="sp-sheet-t"></span><button class="sp-sheet-x" id="sp-sheet-x" type="button" aria-label="Свернуть">▾</button></div>
    <div class="sp-sheet-b" id="sp-sheet-b"><div id="sp-ship"></div></div>
  </div>
  <div id="sp-stat"></div>
  <div class="sp-dock" id="sp-dock">
    <span class="sp-tabs" id="sp-tabs"></span>
    <button class="sp-btn" id="gd-all" type="button">Все</button>
    <button class="sp-btn" id="sp-view" type="button">Обзор</button>
  </div>
</div>

<div class="sp-end" id="sp-end" hidden>
  <div class="sp-end-card">
    <div class="sp-kicker">Итог боя</div>
    <h2 id="sp-end-title">Победа</h2>
    <p id="sp-end-text"></p>
    <div class="sp-btns" style="grid-template-columns:1fr 1fr">
      <button class="sp-btn" id="sp-end-look" type="button">Осмотреть</button>
      <button class="sp-btn gold" id="sp-end-again" type="button">Ещё бой</button>
    </div>
  </div>
</div>

<div class="sp-end sp-poly" id="sp-poly" hidden>
  <div class="sp-end-card">
    <div class="sp-kicker">Полигон · этап «наземка»</div>
    <h2>Свой бой</h2>
    <div class="sp-poly-lab">Планета</div><div class="sp-poly-chips" id="gd-poly-planet"></div>
    <div class="sp-poly-lab">Ты играешь за</div><div class="sp-poly-chips" id="gd-poly-side"></div>
    <div class="sp-poly-lab">Твоя роль</div><div class="sp-poly-chips" id="gd-poly-role"></div>
    <div class="sp-poly-lab">Силы</div><div class="sp-poly-chips" id="gd-poly-size"></div>
    <div class="sp-poly-lab">Противник</div><div class="sp-poly-chips" id="gd-poly-foe"></div>
    <div class="sp-poly-lab">Захват площади</div><div class="sp-poly-chips" id="gd-poly-cap"></div>
    <div class="sp-btns" style="grid-template-columns:1fr"><button class="sp-btn gold" id="gd-poly-go" type="button">В бой</button></div>
  </div>
</div>

<div class="sp-toast" id="sp-toast"></div>
<div class="gp-load" id="gd-load"><div><span></span>Готовлю планету…</div></div>

<script src="../shared/rt-core.js?v=5"></script>
<script src="../shared/rt-figures.js?v=7"></script>
<script src="../shared/rt-army.js?v=3"></script>
<script src="../shared/rt-planets.js?v=2"></script>
<script src="../shared/rt-units.js?v=1"></script>
<script src="../shared/rt-ground.js?v=1"></script>
<script src="../shared/rt-vehicles.js?v=2"></script>
<script src="../shared/rt-heroes.js?v=1"></script>
<script src="terrain.js?v=2"></script>
<script src="../space/space-gfx.js?v=1"></script>
<script src="ground.js?v=1"></script>
</body>
</html>
