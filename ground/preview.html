<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Планеты — наземка 2.0</title>
<link rel="stylesheet" href="preview.css?v=1">
</head>
<body>
<canvas id="gp-canvas"></canvas>
<canvas id="gp-fx"></canvas>

<a id="gp-back" href="../game/galaxy-map.html">← В игру</a>
<div id="gp-tr">
  <button id="gp-zin" type="button" aria-label="Приблизить">+</button>
  <button id="gp-zout" type="button" aria-label="Отдалить">−</button>
  <button id="gp-fit" type="button" aria-label="Вся карта" title="Вся карта">
    <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
  </button>
</div>

<div class="gp-panel gp-top" id="gp-top">
  <div class="gp-row">
    <span class="gp-kicker">Наземка 2.0 · карты планет</span>
    <span class="gp-spacer"></span>
    <button class="gp-link" id="gp-more" type="button">Описание</button>
  </div>
  <div class="gp-row gp-title">
    <i class="gp-globe" id="gp-globe"></i>
    <b id="gp-name">—</b>
    <span class="gp-weather" id="gp-weather"></span>
  </div>
  <p class="gp-about" id="gp-about" hidden></p>
  <div class="gp-planets" id="gp-planets"></div>
</div>

<div class="gp-panel gp-bottom" id="gp-bottom">
  <div class="gp-layers" id="gp-layers">
    <button class="gp-chip on" data-layer="zones" type="button">Зоны</button>
    <button class="gp-chip" data-layer="pass" type="button">Проходимость</button>
    <button class="gp-chip" data-layer="grid" type="button">Сетка</button>
    <button class="gp-chip on" data-layer="weather" type="button">Погода</button>
  </div>
  <div class="gp-cell" id="gp-cell"><span class="gp-dim">Коснитесь клетки — покажу, что на ней.</span></div>
  <div class="gp-legend" id="gp-legend"></div>
</div>

<div class="gp-load" id="gp-load"><div><span></span>Рисую местность…</div></div>

<script src="../shared/rt-planets.js?v=2"></script>
<script src="terrain.js?v=2"></script>
<script src="preview.js?v=2"></script>
</body>
</html>
