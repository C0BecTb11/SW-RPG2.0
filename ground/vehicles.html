<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Техника и герои — наземка 2.0</title>
<link rel="stylesheet" href="preview.css?v=1">
<style>
  html, body { overflow: auto; touch-action: auto; }
  .vh-wrap { max-width: 1100px; margin: 0 auto; padding: calc(60px + env(safe-area-inset-top, 0px)) 12px 40px; }
  .vh-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .vh-head h1 { font-size: 15px; color: #e8d9a8; font-weight: normal; margin: 0; letter-spacing: 0.5px; }
  .vh-ctl { display: flex; gap: 5px; flex-wrap: wrap; }
  .vh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
  .vh-card { background: linear-gradient(180deg, rgba(13,17,25,0.94), rgba(8,11,17,0.94)); border: 1px solid #1c2530; border-radius: 10px; padding: 8px; }
  .vh-card.rep { border-left: 3px solid #4a90d9; } .vh-card.cis { border-left: 3px solid #d94a4a; }
  .vh-card h2 { font-size: 12px; margin: 0 0 6px; color: #e8d9a8; font-weight: normal; display: flex; gap: 8px; align-items: center; }
  .vh-card h2 span { color: #55606c; font-size: 10px; margin-left: auto; }
  .vh-row { display: grid; grid-template-columns: 120px 1fr; gap: 8px; align-items: stretch; }
  .vh-row img { width: 120px; height: 120px; object-fit: cover; border-radius: 6px; border: 1px solid #1c2530; display: block; }
  .vh-big { width: 100%; aspect-ratio: 1; border-radius: 6px; border: 1px solid #1c2530; display: block; background: #2e3a28; }
  .vh-small { display: flex; gap: 6px; margin-top: 6px; align-items: flex-end; flex-wrap: wrap; }
  .vh-small canvas { border-radius: 4px; border: 1px solid #1c2530; background: #2e3a28; }
  .vh-small .gp-dim { margin-left: auto; }
</style>
</head>
<body>
<a id="gp-back" href="preview.html">← Карты</a>
<div class="vh-wrap">
  <div class="vh-head">
    <h1>Наземка 2.0 · техника и герои сверху</h1>
    <div class="vh-ctl" id="vh-ctl">
      <button class="gp-chip on" data-k="spin" type="button">Поворот</button>
      <button class="gp-chip on" data-k="walk" type="button">Ход</button>
      <button class="gp-chip" data-k="dmg" type="button">Повреждения</button>
      <button class="gp-chip" data-k="grid" type="button">Сетка клеток</button>
      <button class="gp-chip" data-k="sand" type="button">Фон: песок</button>
    </div>
  </div>
  <div class="vh-grid" id="vh-grid"></div>
  <div class="vh-head" style="margin-top:18px"><h1>Герои: джедаи и ситхи</h1>
    <div class="vh-ctl" id="vh-acts"></div></div>
  <div class="vh-grid" id="vh-heroes"></div>
</div>
<script src="../shared/rt-vehicles.js?v=2"></script>
<script src="../shared/rt-heroes.js?v=2"></script>
<script>
(function() {
  'use strict';
  var V = window.SWVehicles, TAU = Math.PI * 2, ids = Object.keys(V.TYPES);
  var S = { spin: true, walk: true, dmg: false, grid: false, sand: false }, t0 = Date.now();
  var grid = document.getElementById('vh-grid'), cards = [];
  ids.forEach(function(id) {
    var T = V.TYPES[id], card = document.createElement('div');
    card.className = 'vh-card ' + (id.slice(0, 3));
    card.innerHTML = '<h2>' + T.name + '<span>' + id + ' · ' + T.size + '×' + T.size + '</span></h2>' +
      '<div class="vh-row"><img src="../assets/units/' + id + '.jpg" alt=""><canvas class="vh-big"></canvas></div>' +
      '<div class="vh-small"><canvas title="в бою: 32 точки на клетку"></canvas><canvas title="приближение ×2"></canvas><canvas title="приближение ×3"></canvas><span class="gp-dim">32 · 64 · 96 точек на клетку</span></div>';
    grid.appendChild(card);
    cards.push({ id: id, T: T, big: card.querySelector('.vh-big'), small: Array.prototype.slice.call(card.querySelectorAll('.vh-small canvas')) });
  });
  document.getElementById('vh-ctl').addEventListener('click', function(e) {
    var b = e.target.closest('[data-k]'); if (!b) return;
    var k = b.getAttribute('data-k'); S[k] = !S[k]; b.classList.toggle('on', S[k]);
  });
  function ground(c, w, h, ppc) {
    c.fillStyle = S.sand ? '#b48a58' : '#3f5a2e'; c.fillRect(0, 0, w, h);
    c.fillStyle = S.sand ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.08)';
    for (var i = 0; i < 40; i++) { var x = (i * 7919) % w, y = (i * 104729) % h; c.fillRect(x, y, 3, 2); }
    if (S.grid) { c.strokeStyle = 'rgba(255,255,255,0.18)'; c.lineWidth = 1; for (var q = 0; q <= w; q += ppc) { c.beginPath(); c.moveTo(q + 0.5, 0); c.lineTo(q + 0.5, h); c.stroke(); c.beginPath(); c.moveTo(0, q + 0.5); c.lineTo(w, q + 0.5); c.stroke(); } }
  }
  function frame() {
    var t = (Date.now() - t0) / 1000, dpr = Math.min(2, window.devicePixelRatio || 1);
    cards.forEach(function(k) {
      var ang = S.spin ? (t * 0.35) % TAU : 0, u = { ang: ang, mv: S.walk ? 1 : 0, phase: S.walk ? t * 4 : 0, hp: S.dmg ? 0.3 : 1 };
      var big = k.big, w = big.clientWidth, px = Math.round(w * dpr);
      if (big.width !== px) { big.width = px; big.height = px; }
      var c = big.getContext('2d'), ppc = px / (k.T.span + 0.4);
      c.setTransform(1, 0, 0, 1, 0, 0); ground(c, px, px, ppc);
      c.translate(px / 2, px / 2); c.scale(ppc, ppc); V.draw(c, k.id, u);
      k.small.forEach(function(cv, i) {
        var pp = [32, 64, 96][i], c2 = cv.getContext('2d'), need = Math.round(pp * (k.T.span + 0.3));
        if (cv.width !== need * dpr) { cv.width = cv.height = need * dpr; cv.style.width = cv.style.height = need + 'px'; }
        c2.setTransform(dpr, 0, 0, dpr, 0, 0);
        ground(c2, need, need, pp);
        c2.translate(need / 2, need / 2); c2.scale(pp, pp); V.draw(c2, k.id, u);
      });
    });
    heroFrame(t, dpr);
    requestAnimationFrame(frame);
  }
  // герои
  var H = window.SWHeroes, ACT_NAME = { idle: 'Стойка', run: 'Бег', slash: 'Удар', deflect: 'Отражение', push: 'Толчок', 'throw': 'Бросок меча', dash: 'Выпад', lightning: 'Молнии', choke: 'Удушение', mind: 'Внушение', heal: 'Исцеление', barrier: 'Купол' };
  var HS = { act: 'idle' }, hcards = [], acts = document.getElementById('vh-acts');
  H.ACTS.forEach(function(a) { var b = document.createElement('button'); b.type = 'button'; b.className = 'gp-chip' + (a === 'idle' ? ' on' : ''); b.textContent = ACT_NAME[a]; b.setAttribute('data-act', a); acts.appendChild(b); });
  acts.addEventListener('click', function(e) { var b = e.target.closest('[data-act]'); if (!b) return; HS.act = b.getAttribute('data-act'); Array.prototype.forEach.call(acts.children, function(x) { x.classList.toggle('on', x === b); }); });
  var hgrid = document.getElementById('vh-heroes');
  var portraits = []; for (var i = 1; i <= 11; i++) portraits.push(['republic', 'jedi_' + (i < 10 ? '0' + i : i)]); for (i = 1; i <= 6; i++) portraits.push(['cis', 'sith_0' + i]);
  portraits.forEach(function(p) {
    var card = document.createElement('div'), L = H.look(p[0], p[1]);
    card.className = 'vh-card ' + (p[0] === 'cis' ? 'cis' : 'rep');
    card.innerHTML = '<h2>' + (p[0] === 'cis' ? 'Ситх' : 'Джедай') + '<span>' + p[1] + '</span></h2><div class="vh-row"><img src="../assets/units/heroes/' + p[1] + '.jpg" alt=""><canvas class="vh-big"></canvas></div>' +
      '<div class="vh-small"><canvas title="в бою: 32 точки на клетку"></canvas><canvas title="×2"></canvas><canvas title="×3"></canvas><span class="gp-dim">32 · 64 · 96</span></div>';
    hgrid.appendChild(card);
    hcards.push({ look: L, big: card.querySelector('.vh-big'), small: Array.prototype.slice.call(card.querySelectorAll('.vh-small canvas')) });
  });
  function heroFrame(t, dpr) {
    hcards.forEach(function(k) {
      var act = HS.act, kk = (t * 0.7) % 1, u = { aim: S.spin ? (t * 0.35) % TAU : 0, mv: act === 'run' || act === 'dash' ? 1 : 0, phase: t * 7, act: act, k: kk, look: k.look };
      var big = k.big, w = big.clientWidth, px = Math.round(w * dpr);
      if (big.width !== px) { big.width = px; big.height = px; }
      var c = big.getContext('2d'), ppc = px / 2.6;
      c.setTransform(1, 0, 0, 1, 0, 0); ground(c, px, px, ppc);
      c.translate(px / 2, px / 2); c.scale(ppc, ppc); H.draw(c, u);
      if (act === 'throw') H.fx.blade(c, 0.9, 0, t, k.look.blade);
      if (act === 'lightning') { H.fx.lightning(c, 0.4, -0.1, 1.1, -0.25, (t * 20) | 0); H.fx.lightning(c, 0.4, 0.1, 1.15, 0.2, (t * 20 + 7) | 0); }
      if (act === 'choke') H.fx.choke(c, 0.4, 0, 1.1, 0.1, t);
      if (act === 'mind') H.fx.ring(c, 0.1, 0, kk);
      if (act === 'barrier') H.fx.dome(c, 0, 0, 1.1, t);
      if (act === 'push') H.fx.wave(c, 0.2, 0, u.aim, kk);
      k.small.forEach(function(cv, i) {
        var pp = [32, 64, 96][i], c2 = cv.getContext('2d'), need = Math.round(pp * 1.6);
        if (cv.width !== need * dpr) { cv.width = cv.height = need * dpr; cv.style.width = cv.style.height = need + 'px'; }
        c2.setTransform(dpr, 0, 0, dpr, 0, 0); ground(c2, need, need, pp); c2.translate(need / 2, need / 2); c2.scale(pp, pp); H.draw(c2, u);
      });
    });
  }
  requestAnimationFrame(frame);
  window.VH = { S: S, cards: cards, HS: HS };
})();
</script>
</body>
</html>
