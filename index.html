<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Star Wars: Global Conflict</title>
<meta name="theme-color" content="#05060a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/app/icon-192.png">
<link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Global Conflict">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/banner.css">
<style>
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 30px;
  }
  .links a {
    display: block;
    text-align: center;
    padding: 12px;
    background: #4a90d9;
    color: #0a0d14;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: bold;
    border-radius: 2px;
  }
  .links a.secondary {
    background: #2a3644;
    color: #cfd8dc;
  }
  #status {
    text-align: center;
    font-size: 12px;
    color: #55606c;
    margin-top: 20px;
    min-height: 16px;
  }
  /* подсказка, как поставить игру на телефон, когда кнопки установки нет */
  .install-hint {
    margin-top: 2px;
    padding: 10px 12px;
    border: 1px dashed #2a3644;
    border-radius: 2px;
    text-align: center;
    font-size: 11px;
    line-height: 1.6;
    letter-spacing: 0.5px;
    color: #8fa8c4;
  }
  .install-hint b { color: #cfd8dc; font-weight: normal; }
</style>
</head>
<body>

<div id="banner-placeholder"></div>

<div id="box">
  <div id="status">Проверяем сессию...</div>
  <div class="links" id="links" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/err-report.js?v=1"></script>
<script src="js/banner.js"></script>
<script>
  var statusEl = document.getElementById('status');
  var linksEl = document.getElementById('links');

  supabase.auth.getSession().then(function(res) {
    linksEl.style.display = 'flex';
    if (res.data.session) {
      statusEl.textContent = 'Вошёл как ' + res.data.session.user.email;
      linksEl.innerHTML =
        '<a href="game/galaxy-map.html">Войти в галактику</a>';
    } else {
      statusEl.textContent = 'Ты не авторизован';
      linksEl.innerHTML =
        '<a href="auth.html">Войти / Зарегистрироваться</a>';
    }
    linksReady = true; installUi();
  });

  // Установка на телефон. Chrome сам собирает приложение из сайта (иконка, весь экран) —
  // кнопка появляется, когда Chrome готов; до того и в других браузерах — подсказка через меню.
  // На iPhone кнопки установки не бывает — подсказка «Поделиться → На экран Домой».
  // Уже открыто как приложение — ничего не предлагаем.
  var linksReady = false, installEv = null;
  function inApp() {
    var ua = navigator.userAgent || '';
    if (ua.indexOf('SWGC-App') >= 0) return true;
    if (navigator.standalone) return true;                      // iPhone: открыто с экрана «Домой»
    try { return matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; }
  }
  function installUi() {
    if (!linksReady || inApp()) return;
    var ua = navigator.userAgent || '', hint = document.getElementById('install-hint');
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var mobile = ios || /Android|Mobi/i.test(ua);
    if (installEv && !document.getElementById('install-app')) {
      if (hint) hint.remove();
      linksEl.insertAdjacentHTML('beforeend', '<a href="#" id="install-app" class="secondary">' + (mobile ? 'Установить на телефон' : 'Установить на компьютер') + '</a>');
      document.getElementById('install-app').addEventListener('click', function(e) {
        e.preventDefault();
        if (!installEv) return;
        installEv.prompt();
        installEv.userChoice.then(function(r) { if (r && r.outcome === 'accepted') { var b = document.getElementById('install-app'); if (b) b.remove(); } });
        installEv = null;
      });
    }
    if (installEv || hint) return;
    var chromium = /Chrome\/|Edg\//.test(ua) && !/OPR\/|YaBrowser/.test(ua), mac = /Macintosh/.test(ua);
    var text = ios ? 'На iPhone: открой в <b>Safari</b> → «Поделиться» → <b>«На экран „Домой“»</b>'
             : /Android/i.test(ua) ? 'Игру можно поставить как приложение: в <b>Chrome</b> → ⋮ → <b>«Установить приложение»</b>'
             : chromium ? 'Игру можно поставить как программу: значок <b>«Установить»</b> справа в адресной строке Chrome или Edge'
             : mac && /Safari\//.test(ua) ? 'Игру можно поставить как программу: Safari → «Файл» → <b>«Добавить в Dock»</b>'
             : '';
    if (text) linksEl.insertAdjacentHTML('beforeend', '<div class="install-hint" id="install-hint">' + text + '</div>');
  }
  window.addEventListener('beforeinstallprompt', function(e) { e.preventDefault(); installEv = e; installUi(); });
  window.addEventListener('appinstalled', function() { var b = document.getElementById('install-app'); if (b) b.remove(); });
</script>
</body>
</html>
