<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Star Wars: Global Conflict</title>
<meta name="theme-color" content="#05060a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/app/icon-192.png">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/banner.css">
<style>
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 30px;
  }
  .links a {
    display: block;
    text-align: center;
    padding: 12px;
    background: #4a90d9;
    color: #0a0d14;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: bold;
    border-radius: 2px;
  }
  .links a.secondary {
    background: #2a3644;
    color: #cfd8dc;
  }
  #status {
    text-align: center;
    font-size: 12px;
    color: #55606c;
    margin-top: 20px;
    min-height: 16px;
  }
</style>
</head>
<body>

<div id="banner-placeholder"></div>

<div id="box">
  <div id="status">Проверяем сессию...</div>
  <div class="links" id="links" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/err-report.js?v=1"></script>
<script src="js/banner.js"></script>
<script>
  var statusEl = document.getElementById('status');
  var linksEl = document.getElementById('links');

  supabase.auth.getSession().then(function(res) {
    linksEl.style.display = 'flex';
    if (res.data.session) {
      statusEl.textContent = 'Вошёл как ' + res.data.session.user.email;
      linksEl.innerHTML =
        '<a href="game/galaxy-map.html">Войти в галактику</a>';
    } else {
      statusEl.textContent = 'Ты не авторизован';
      linksEl.innerHTML =
        '<a href="auth.html">Войти / Зарегистрироваться</a>';
    }
    linksReady = true; installUi();
  });

  // Установка на телефон. Chrome сам собирает приложение из сайта (иконка, весь экран) —
  // кнопка появляется, когда Chrome готов. Запасной путь для Android — файл APK.
  // Уже открыто как приложение (наше APK или установленное из Chrome) — ничего не предлагаем.
  var linksReady = false, installEv = null;
  function inApp() {
    var ua = navigator.userAgent || '';
    if (ua.indexOf('SWGC-App') >= 0) return true;
    try { return matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; }
  }
  function installUi() {
    if (!linksReady || inApp()) return;
    if (installEv && !document.getElementById('install-app')) {
      var apk = document.getElementById('apk-app'), html = '<a href="#" id="install-app" class="secondary">Установить на телефон</a>';
      if (apk) apk.insertAdjacentHTML('beforebegin', html); else linksEl.insertAdjacentHTML('beforeend', html);
      document.getElementById('install-app').addEventListener('click', function(e) {
        e.preventDefault();
        if (!installEv) return;
        installEv.prompt();
        installEv.userChoice.then(function(r) { if (r && r.outcome === 'accepted') { var b = document.getElementById('install-app'); if (b) b.remove(); } });
        installEv = null;
      });
    }
    if (/Android/i.test(navigator.userAgent || '') && !document.getElementById('apk-app')) {
      linksEl.insertAdjacentHTML('beforeend',
        '<a class="secondary" id="apk-app" href="https://github.com/C0BecTb11/SW-RPG2.0/releases/download/app/sw-global-conflict.apk">Файл APK для Android</a>');
    }
  }
  window.addEventListener('beforeinstallprompt', function(e) { e.preventDefault(); installEv = e; installUi(); });
  window.addEventListener('appinstalled', function() { var b = document.getElementById('install-app'); if (b) b.remove(); });
</script>
</body>
</html>
