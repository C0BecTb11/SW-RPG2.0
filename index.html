<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Star Wars: Global Conflict</title>
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/banner.css">
<style>
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 30px;
  }
  .links a {
    display: block;
    text-align: center;
    padding: 12px;
    background: #4a90d9;
    color: #0a0d14;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: bold;
    border-radius: 2px;
  }
  .links a.secondary {
    background: #2a3644;
    color: #cfd8dc;
  }
  #status {
    text-align: center;
    font-size: 12px;
    color: #55606c;
    margin-top: 20px;
    min-height: 16px;
  }
</style>
</head>
<body>

<div id="banner-placeholder"></div>

<div id="box">
  <div id="status">Проверяем сессию...</div>
  <div class="links" id="links" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/err-report.js?v=1"></script>
<script src="js/banner.js"></script>
<script>
  var statusEl = document.getElementById('status');
  var linksEl = document.getElementById('links');

  supabase.auth.getSession().then(function(res) {
    linksEl.style.display = 'flex';
    if (res.data.session) {
      statusEl.textContent = 'Вошёл как ' + res.data.session.user.email;
      linksEl.innerHTML =
        '<a href="game/galaxy-map.html">Войти в галактику</a>';
    } else {
      statusEl.textContent = 'Ты не авторизован';
      linksEl.innerHTML =
        '<a href="auth.html">Войти / Зарегистрироваться</a>';
    }
    // телефон на Android и игра открыта в браузере — предложить приложение (весь экран, иконка)
    var ua = navigator.userAgent || '';
    if (/Android/i.test(ua) && ua.indexOf('SWGC-App') < 0) {
      linksEl.insertAdjacentHTML('beforeend',
        '<a class="secondary" href="https://github.com/C0BecTb11/SW-RPG2.0/releases/download/app/sw-global-conflict.apk">Приложение для Android</a>');
    }
  });
</script>
</body>
</html>
